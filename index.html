<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Game with Ruby (Module)</title>
  <link rel="stylesheet" href="fixed-style.css" />
  <script type="module" src="main.js"></script>
</head>
<body>
  <div class="sidebar">
    <h1>Memory Game</h1>
    <div id="controls">
      <label for="mode">Mode:</label>
      <select id="mode">
        <option value="random">Random</option>
        <option value="ascending">Ascending</option>
      </select>

      <label for="pair-count">Number of Pairs:</label>
      <select id="pair-count">
        <option value="max">MAX</option>
      </select>

      <label>
        <input type="checkbox" id="use-file" /> Use External File
      </label>
      <input type="file" id="file-input" accept=".txt" style="display: none" />

      <label>
        <input type="checkbox" id="show-ruby" checked /> Show Ruby
      </label>

      <label>
        <input type="checkbox" id="enable-timer" checked />
        タイマーモード
      </label>

      <button id="start-game">Start Game</button>
    </div>

    <div id="settings-panel" style="display: none;"></div>
    <div id="log-area"></div>
  </div>

  <div class="main">
    <div id="game-board"></div>
  </div>
</body>
</html>
