<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Game with Ruby</title>
  <link rel="stylesheet" href="merged-style.css" />

  <script src="ruby.js" defer></script>
  <script src="game.js" defer></script>
  <script src="settings-panel.js" defer></script>

</head>
<body>
  <div class="sidebar">
    
    <h1>Memory Game</h1>
    <div id="controls">
      <label for="mode">Mode:</label>
      <select id="mode">
        <option value="random">Random</option>
        <option value="ascending">Ascending</option>
      </select>

      <label for="pair-count">Number of Pairs:</label>
      <select id="pair-count">
        <option value="max">MAX</option>
      </select>

      <label>
        <input type="checkbox" id="use-file" /> Use External File
      </label>
      <input type="file" id="file-input" accept=".txt" style="display: none" />

      <label>
        <input type="checkbox" id="show-ruby" checked /> Show Ruby
      </label>

      <label>
        <input type="checkbox" id="enable-timer" checked />
        タイマーモード
      </label>
      

      <button id="start-game">Start Game</button>
    </div>
    
  </div>
  <div class="main">
    <div id="game-board"></div>
  </div>
</body>
</html>
